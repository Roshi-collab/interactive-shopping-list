
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Interactive Shopping List</h1>

    <div class="list-form">
        <form>
            <input
                type="text"
                id="product"
                name="product"
                placeholder="Item name"
                required
            >

            <input
                type="number"
                id="price"
                name="price"
                placeholder="Price (Ksh)"
                min="0"
                step="0.01"
                required
            >

            <button type="submit">Add</button>
        </form>
    </div>

    <section class="container"></section>

    <section class="total-section">
        <p class="total">Total purchased: Ksh 0.00</p>
    </section>

    <section class="btn-sections hidden">
        <button type="button" class="clear-list">Clear list</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
